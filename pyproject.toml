[project]
name = "network-monitor"
version = "1.0.0"
description = "Détection d'anomalies réseau non supervisée (trafic + pertes), incidents et API de supervision."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
    "PyYAML",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["network_monitor*"]

[tool.pytest.ini_options]
testpaths = ["network_monitor/tests"]
