name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Installer les dépendances
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check network_monitor
      - name: Typage (mypy)
        run: mypy network_monitor
      - name: Tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installer (à froid, sans --legacy-peer-deps)
        run: npm ci
      - name: Tests (vitest + jsdom)
        run: npm test
      - name: Build
        run: npm run build
