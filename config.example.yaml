# Exemple de configuration (§35). Charger avec : AppConfig.from_yaml("config.yaml")
# Durées : "5m", "10 minutes", "2h", "30d" ... Tous les champs sont optionnels.
source:
  type: mock            # mock | csv | parquet | sql | prometheus
  # csv / parquet : rejeu d'un export (timestamp, output_id, traffic_mbps, loss_percent). Parquet
  # accepte aussi l'archive écrite par storage.archive_dir (un dossier par sortie).
  # path: export.csv
  # sql : table en lecture seule (url jamais renvoyée en clair par GET /config)
  # url: mysql+pymysql://user:pass@host/db
  # table: traffic_measurements
  # columns: {timestamp: ts, output_id: port, traffic_mbps: mbps, loss_percent: loss}
  # prometheus : une entrée par sortie, en PromQL. Le trafic doit sortir EN Mbps, les pertes EN %.
  # Utiliser des compteurs 64 bits (ifHCInOctets) : un compteur 32 bits boucle en ~34 s à 1 Gbps.
  # url: http://prometheus:9090
  # bearer_token_env: NM_SOURCE_BEARER
  # lag: 30s            # retard laissé aux collecteurs
  # prometheus:
  #   LINK_DOUALA_YAOUNDE:
  #     traffic: 'rate(ifHCInOctets{instance="r1",ifName="Te0/0/1"}[5m]) * 8 / 1e6'
  #     loss: '100 * rate(ifInDiscards{instance="r1",ifName="Te0/0/1"}[5m]) / rate(ifHCInUcastPkts{instance="r1",ifName="Te0/0/1"}[5m])'
storage: {}
  # database_url: sqlite:///network_monitor.db
  # archive_dir: /data/archive   # les mesures purgées y sont rangées en Parquet (un dossier par sortie)
notifications:
  enabled: false
  timezone: Africa/Douala        # fuseau des heures dans les messages
  batch_window: 20s              # les alertes rapprochées partent dans un seul message
  max_attempts: 6
  escalate_after: null           # ex. 15m : un incident confirmé, non pris en charge (PUT /incidents/{id}/ack) depuis ce délai,
                                 # émet UNE alerte « escalated », reçue par les canaux dont `events` la contient (second groupe)
  channels: []
  # Les secrets sont dans l'environnement (.env), jamais ici : chaque canal nomme sa variable.
  # channels:
  #   - {name: noc, type: telegram, chat_id: "-1001234567890", min_severity: warning}   # groupe Telegram
  #   - {name: ops-sms, type: sms, provider: android_gateway,                           # SMS de groupe
  #      recipients: ["+237690000001", "+237690000002"], min_severity: critical,
  #      events: [opened, closed], max_messages_per_hour: 20}
  #   - {name: ticketing, type: webhook}                                                # POST JSON signé
  #   - {name: astreinte, type: telegram, chat_id: "-1009876543210", events: [escalated]}  # second groupe : n'est prévenu qu'en cas d'escalade
monitoring:
  interval: 5m
history:
  minimum: 30d          # en dessous, la sortie n'est pas calibrée
  preferred: 90d
model_selection:
  minimum_history: 45d  # en dessous, repli sur la baseline saisonnière
  validation_window: 7d
forecast:
  models: [seasonal_baseline, holt_winters]   # candidats à la sélection automatique
recalibration:
  enabled: true
  interval: 24h         # les plages d'incident actif sont exclues de l'ajustement
detection:
  loss:
    enabled: true
    loss_std_floor: 0.05
  isolation_forest:     # confirmation optionnelle (§17), n'ouvre jamais un incident seule
    enabled: false      # nécessite scikit-learn
    n_estimators: 100
    confirm_score: 0.6
  extended_features:    # §9.2 : calcule et stocke les features étendues
    enabled: false
incident:
  warning_score: 0.50   # doit vérifier close < warning < open
  open_score: 0.75
  close_score: 0.40
  minimum_duration: 15m
  recovery_duration: 5m
  min_suspect_steps: 3   # pas au-dessus de warning_score avant de tolérer des creux (intermittents)
  stale_after: 15m
  merge_window: 20m     # nouvelle anomalie après fermeture => même incident
alerts:
  enabled: true
  critical_score: 0.80
topology:               # inhibition amont/aval : la clé dépend de la valeur (aval -> amont), sans cycle
  parents: {}           # ex. {LINK_DOUALA_BAFOUSSAM: LINK_DOUALA_YAOUNDE}
  correlation_window: 15m
heartbeat:              # signal de vie externe (ex. Healthchecks.io) ; l'URL est dans NM_HEARTBEAT_URL
  enabled: false
  period: 60s
  timeout: 10s
  fail_suffix: /fail    # ajouté à l'URL pour signaler un défaut, avec les raisons en corps
